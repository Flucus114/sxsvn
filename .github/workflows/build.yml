name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o zip e localizar o projeto
        id: proj
        run: |
          mkdir -p _proj
          n=$(ls -1 ./*.zip 2>/dev/null | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "Esperava exatamente 1 zip na raiz, encontrei $n:"
            ls -la ./*.zip
            exit 1
          fi
          z=$(ls -1 ./*.zip)
          echo "Usando: $z"
          unzip -o -q "$z" -d _proj
          f=$(find _proj -name settings.gradle | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle NAO encontrado no zip."
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - run: gradle build
        working-directory: ${{ steps.proj.outputs.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: sculkharp-jar
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
